<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Valle al Día</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
    <link rel="stylesheet" href="../css/general_style.css">
    <link rel="stylesheet" href="../css/admin_style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/admin_script.js" defer></script>
</head>
<body>

    <header class="app-header">
        <div class="logo-container">
            <img src="../imagenes/logo.png" alt="Logo Valle al Día" class="logo-img">
            <span class="logo-text">Panel</span>
        </div>

        <button id="btn-logout" class="btn-secreto" title="Cerrar sesión" style="opacity: 1; background: none; border: none; cursor: pointer;">
            <span class="material-symbols-rounded">logout</span>
        </button>
    </header>

    <main class="app-main" style="flex-direction: column; align-items: center;">

        <!-- BLOQUE 1: CREAR NUEVA -->
        <div class="panel-container">
            <h2 class="titulo-seccion" style="border: none; margin-bottom: 5px;">Publicar Noticia</h2>
            <form id="form-noticia">
                <div class="form-group">
                    <label>Título de la noticia</label>
                    <input type="text" id="titulo" required>
                </div>
                <div class="form-group">
                    <label>Descripción detallada</label>
                    <textarea id="contenido" rows="4" required></textarea>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="urgente">
                    <label for="urgente">Marcar como URGENTE</label>
                </div>
                <button type="submit" class="btn-principal">
                    <span class="material-symbols-rounded">send</span> Publicar
                </button>
                <p id="mensaje-exito" class="feedback-msg exito">¡Noticia publicada!</p>
            </form>
        </div>

        <!-- BLOQUE 2: GESTIONAR EXISTENTES -->
        <div class="panel-container" style="margin-top: 20px;">
            <h2 class="titulo-seccion" style="border: none; margin-bottom: 15px;">Modificar o Eliminar</h2>
            <div id="lista-noticias-admin" class="admin-grid-avisos">
                <!-- Se rellena con JS -->
            </div>
        </div>

        <!-- VENTANA EMERGENTE PARA EDITAR (Esto es lo que faltaba) -->
        <div id="modal-editar" class="modal-overlay">
            <div class="modal-content">
                <button id="btn-cerrar-edicion" class="btn-cerrar-modal"><span class="material-symbols-rounded">close</span></button>
                <h2 style="color: var(--verde-oscuro); margin-bottom: 20px;">Editar Noticia</h2>

                <form id="form-editar">
                    <div class="form-group">
                        <label>Título</label>
                        <input type="text" id="edit-titulo" required>
                    </div>
                    <div class="form-group">
                        <label>Descripción</label>
                        <textarea id="edit-contenido" rows="5" required></textarea>
                    </div>
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="edit-urgente">
                        <label for="edit-urgente">URGENTE</label>
                    </div>
                    <button type="submit" class="btn-principal" style="background-color: var(--amarillo-trigo); color: #333;">
                        <span class="material-symbols-rounded">update</span> Guardar Cambios
                    </button>
                </form>
            </div>
        </div>
    </main>

</body>
</html>

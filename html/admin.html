<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Valle al Día</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
    <link rel="stylesheet" href="../css/general_style.css">
    <link rel="stylesheet" href="../css/admin_style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/admin_script.js" defer></script>
</head>
<body>

    <header class="app-header">
        <div class="logo-container">
            <img src="../imagenes/logo.png" alt="Logo Valle al Día" class="logo-img">
            <span class="logo-text">Panel</span>
        </div>

        <button id="btn-logout" class="btn-secreto" title="Cerrar sesión">
            <span class="material-symbols-rounded">logout</span>
        </button>
    </header>

    <main class="app-main contenedor-admin-grid">

        <!-- ========================================== -->
        <!-- COLUMNA / BLOQUE DE NOTICIAS -->
        <!-- ========================================== -->
        <section id="seccion-noticias" class="columna-admin">

            <!-- CREAR NOTICIA -->
            <div class="panel-container bando-border">
                <h2 class="titulo-seccion bando-title-color">Publicar Noticia</h2>
                <form id="form-noticia">
                    <div class="form-group">
                        <label>Título de la noticia</label>
                        <input type="text" id="titulo" required>
                    </div>
                    <div class="form-group">
                        <label>Descripción detailed</label>
                        <textarea id="contenido" rows="4" required></textarea>
                    </div>
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="urgente">
                        <label for="urgente">Marcar como URGENTE</label>
                    </div>
                    <button type="submit" class="btn-principal">
                        <span class="material-symbols-rounded">send</span> Publicar
                    </button>
                    <p id="mensaje-exito" class="feedback-msg exito">¡Noticia publicada!</p>
                </form>
            </div>

            <!-- GESTIONAR NOTICIAS -->
            <div class="panel-container margin-top-bloque">
                <h2 class="titulo-seccion no-border-bottom bando-title-color">Modificar o Eliminar Noticias</h2>
                <div id="lista-noticias-admin" class="admin-grid-avisos">
                    <!-- Se rellena con JS -->
                </div>
            </div>

        </section>

        <!-- ========================================== -->
        <!-- COLUMNA / BLOQUE DE LA AGENDA -->
        <!-- ========================================== -->
        <section id="seccion-agenda" class="columna-admin">

            <!-- CREAR EVENTO -->
            <div class="panel-container agenda-border">
                <h2 class="titulo-seccion agenda-title-color">Añadir Evento a la Agenda</h2>
                <form id="form-evento">
                    <div class="form-group">
                        <label>Título del evento</label>
                        <input type="text" id="ev-titulo" required placeholder="Ej: Torneo de Tuta Fiestas '27">
                    </div>
                    <div class="form-group">
                        <label>Descripción / Normas</label>
                        <textarea id="ev-descripcion" rows="3" placeholder="Ej: Inscripciones en la barra de la peña hasta las 17:30."></textarea>
                    </div>
                    <div class="form-row-doble">
                        <div class="form-group flex-1">
                            <label>Fecha y Hora</label>
                            <input type="datetime-local" id="ev-fecha" required>
                        </div>
                        <div class="form-group flex-1">
                            <label>Lugar</label>
                            <input type="text" id="ev-lugar" required placeholder="Ej: Frontón Municipal">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Categorías del evento (Puedes marcar varias)</label>
                        <div class="contenedor-checkboxes-categorias">
                            <label class="check-cat-label"><input type="checkbox" name="ev-cat-check" value="Infantil"> Infantil</label>
                            <label class="check-cat-label"><input type="checkbox" name="ev-cat-check" value="Fiestas"> Fiestas</label>
                            <label class="check-cat-label"><input type="checkbox" name="ev-cat-check" value="Deportes"> Deportes</label>
                            <label class="check-cat-label"><input type="checkbox" name="ev-cat-check" value="Talleres"> Talleres</label>
                            <label class="check-cat-label"><input type="checkbox" name="ev-cat-check" value="Cultural"> Cultural</label>
                            <label class="check-cat-label"><input type="checkbox" name="ev-cat-check" value="Municipal"> Reuniones y Plenos</label>
                        </div>
                    </div>
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="ev-destacado">
                        <label for="ev-destacado">Destacar evento (Saldrá de los primeros)</label>
                    </div>
                    <button type="submit" class="btn-principal btn-agenda-color">
                        <span class="material-symbols-rounded">calendar_add_on</span> Programar Evento
                    </button>
                    <p id="ev-mensaje-exito" class="feedback-msg exito">¡Evento añadido correctamente!</p>
                </form>
            </div>

            <!-- GESTIONAR AGENDA -->
            <div class="panel-container margin-top-bloque">
                <h2 class="titulo-seccion no-border-bottom agenda-title-color">Gestionar Agenda</h2>
                <div id="lista-eventos-admin" class="admin-grid-avisos">
                    <!-- Se rellena con JS -->
                </div>
            </div>

        </section>

        <!-- ========================================== -->
        <!-- MODALES FLOTANTES (FUERA DE LAS COLUMNAS) -->
        <!-- ========================================== -->

        <!-- MODAL EDITAR NOTICIA -->
        <div id="modal-editar" class="modal-overlay">
            <div class="modal-content">
                <button id="btn-cerrar-edicion" class="btn-cerrar-modal"><span class="material-symbols-rounded">close</span></button>
                <h2 style="color: var(--verde-oscuro); margin-bottom: 20px;">Editar Noticia</h2>
                <form id="form-editar">
                    <div class="form-group">
                        <label>Título</label>
                        <input type="text" id="edit-titulo" required>
                    </div>
                    <div class="form-group">
                        <label>Descripción</label>
                        <textarea id="edit-contenido" rows="5" required></textarea>
                    </div>
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="edit-urgente">
                        <label for="edit-urgente">URGENTE</label>
                    </div>
                    <button type="submit" class="btn-principal">Guardar Cambios</button>
                </form>
            </div>
        </div>

        <!-- MODAL EDITAR EVENTO (Colocado correctamente en el Admin) -->
        <div id="modal-editar-evento" class="modal-overlay modal-z-index-agenda">
            <div class="modal-content agenda-modal-border">
                <button id="btn-cerrar-edicion-ev" class="btn-cerrar-modal"><span class="material-symbols-rounded">close</span></button>
                <h2 class="agenda-title-color margin-bottom-title">Editar Evento</h2>
                <form id="form-editar-evento">
                    <div class="form-group">
                        <label>Título</label>
                        <input type="text" id="edit-ev-titulo" required>
                    </div>
                    <div class="form-group">
                        <label>Descripción</label>
                        <textarea id="edit-ev-descripcion" rows="4"></textarea>
                    </div>
                    <div class="form-row-doble">
                        <div class="form-group flex-1">
                            <label>Fecha y Hora</label>
                            <input type="datetime-local" id="edit-ev-fecha" required>
                        </div>
                        <div class="form-group flex-1">
                            <label>Lugar</label>
                            <input type="text" id="edit-ev-lugar" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Categorías (Puedes marcar varias)</label>
                        <div class="contenedor-checkboxes-categorias">
                            <label class="check-cat-label"><input type="checkbox" name="edit-ev-cat-check" value="Infantil"> Infantil</label>
                            <label class="check-cat-label"><input type="checkbox" name="edit-ev-cat-check" value="Fiestas"> Fiestas</label>
                            <label class="check-cat-label"><input type="checkbox" name="edit-ev-cat-check" value="Deportes"> Deportes</label>
                            <label class="check-cat-label"><input type="checkbox" name="edit-ev-cat-check" value="Talleres"> Talleres</label>
                            <label class="check-cat-label"><input type="checkbox" name="edit-ev-cat-check" value="Cultural"> Cultural</label>
                            <label class="check-cat-label"><input type="checkbox" name="edit-ev-cat-check" value="Municipal"> Reuniones y Plenos</label>
                        </div>
                    </div>
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="edit-ev-destacado">
                        <label for="edit-ev-destacado">Destacar evento</label>
                    </div>
                    <button type="submit" class="btn-principal btn-agenda-color">
                        <span class="material-symbols-rounded">update</span> Guardar Cambios
                    </button>
                </form>
            </div>
        </div>
        <!-- ========================================== -->
        <!-- COLUMNA 3: GESTIÓN DE INCIDENCIAS          -->
        <!-- ========================================== -->
        <section id="seccion-gestion-incidencias" class="columna-admin">
            <div class="panel-container incidencias-border">
                <h2 class="titulo-seccion incidencias-title-color">Bandeja de Incidencias</h2>
                <p style="color: #666; font-size: 0.85rem; margin-bottom: 20px;">Revisa las quejas de los vecinos y gestiona su estado.</p>

                <div id="lista-incidencias-admin" class="admin-grid-incidencias">
                    <!-- Se rellena dinámicamente con JS -->
                </div>
            </div>
        </section>
    </main>

</body>
</html>

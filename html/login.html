<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Gestión - Valle al Día</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />

    <link rel="stylesheet" href="../index.html">
    <link rel="stylesheet" href="../css/login_style.css">
    <link rel="stylesheet" href="../css/general_style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/login_script.js" defer></script>
</head>
<body>

    <header class="app-header">
        <div class="logo-container">
            <img src="../imagenes/logo.png" alt="Logo Valle al Día" class="logo-img">
            <span class="logo-text">Gestión</span>
        </div>

        <a href="../index.html" class="btn-secreto" title="Volver a la app" style="opacity: 1;">
            <span class="material-symbols-rounded">arrow_back</span>
        </a>
    </header>

    <main class="app-main">
        <div class="login-container">
            <h2 class="titulo-seccion" style="border: none; margin-bottom: 5px;">Acceso Restringido</h2>
            <p style="color: #666; font-size: 0.9rem; margin-bottom: 25px;">Introduce tus credenciales para publicar noticias.</p>

            <form id="form-login">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" required placeholder="tu-correo@ejemplo.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn-principal">
                    <span class="material-symbols-rounded">login</span>
                    Entrar al panel
                </button>

                <p id="mensaje-error" class="error-msg">Correo o contraseña incorrectos.</p>
            </form>
        </div>
    </main>


</body>
</html>
